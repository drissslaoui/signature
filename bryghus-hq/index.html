<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bryghus HQ — Christiania Bryghus command center</title>
  <meta name="description" content="Operations command center for Christiania Bryghus: revenue, inventory, production, taproom and bookings. Demo with mock data.">
  <meta name="theme-color" content="#0F0C0B">
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
  <script>
    try { var t = localStorage.getItem('hq_theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="css/app.css">
  <script defer src="js/data.js"></script>
  <script defer src="js/charts.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
<div class="app" id="app">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <a class="sb-brand" href="#/overview">
      <img src="assets/logo.png" alt="" width="40" height="40">
      <span class="sb-brand__text"><strong>Bryghus HQ</strong><small>Christiania Bryghus</small></span>
    </a>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-foot">
      <div class="sb-demo">
        <span class="sb-demo__dot"></span>
        <span><strong>Demo mode</strong><small>All figures are mock data</small></span>
      </div>
      <button type="button" class="sb-user" id="sb-user">
        <span class="avatar">CB</span>
        <span class="sb-user__text"><strong>Owner</strong><small>Christiania Bryghus ApS</small></span>
      </button>
    </div>
  </aside>
  <div class="sb-scrim" id="sb-scrim" hidden></div>

  <!-- ============ MAIN ============ -->
  <div class="main">
    <header class="topbar">
      <button type="button" class="icon-btn tb-menu" id="tb-menu" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false"></button>
      <div class="tb-crumbs"><span>Christiania Bryghus</span><span class="tb-crumbs__sep">/</span><strong id="tb-crumb">Command center</strong></div>
      <button type="button" class="tb-search" id="tb-search">
        <span class="tb-search__icon" data-icon="search"></span>
        <span class="tb-search__label">Search beers, tanks, accounts…</span>
        <kbd>⌘K</kbd>
      </button>
      <div class="tb-right">
        <div class="tb-live" title="Live data feed (simulated)">
          <span class="live-dot"></span><span>Live</span><span class="tb-clock" id="tb-clock">--:--</span>
        </div>
        <button type="button" class="icon-btn" id="tb-theme" aria-label="Switch to light theme"></button>
        <button type="button" class="icon-btn tb-bell" id="tb-bell" aria-label="Alerts">
          <span class="tb-bell__count" id="tb-bell-count">0</span>
        </button>
      </div>
    </header>

    <main class="view" id="view" tabindex="-1"></main>
  </div>
</div>

<!-- tooltip -->
<div class="tooltip" id="tooltip" role="status" aria-live="polite" hidden></div>

<!-- drawer -->
<div class="drawer-scrim" id="drawer-scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" hidden>
  <header class="drawer__head">
    <div>
      <p class="drawer__eyebrow" id="drawer-eyebrow"></p>
      <h2 class="drawer__title" id="drawer-title"></h2>
    </div>
    <button type="button" class="icon-btn" id="drawer-close" aria-label="Close panel"></button>
  </header>
  <div class="drawer__body" id="drawer-body"></div>
</aside>

<!-- command palette -->
<div class="cmdk" id="cmdk" role="dialog" aria-modal="true" aria-label="Command palette" hidden>
  <div class="cmdk__panel">
    <div class="cmdk__search">
      <span data-icon="search"></span>
      <input id="cmdk-input" type="text" placeholder="Jump to a view, beer, tank or account…" autocomplete="off" spellcheck="false" aria-controls="cmdk-list" aria-activedescendant="">
      <kbd>Esc</kbd>
    </div>
    <ul class="cmdk__list" id="cmdk-list" role="listbox"></ul>
    <footer class="cmdk__foot"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span></footer>
  </div>
</div>

<!-- toasts -->
<div class="toasts" id="toasts" aria-live="polite"></div>

</body>
</html>
