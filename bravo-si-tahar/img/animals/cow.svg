<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" class="animal-svg" data-animal="cow">
  <defs>
    <clipPath id="cow-body-clip"><rect x="50" y="194" width="246" height="144" rx="72"/></clipPath>
    <clipPath id="cow-head-clip"><ellipse cx="272" cy="150" rx="82" ry="72"/></clipPath>
  </defs>
  <g stroke="#4A3328" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">

    <!-- tail -->
    <g class="part tail" style="transform-origin:60px 236px">
      <path d="M60 236 C 30 246, 24 278, 34 302" fill="none" stroke-width="20"/>
      <path d="M60 236 C 30 246, 24 278, 34 302" fill="none" stroke="#FFF8EF" stroke-width="7"/>
      <path d="M34 290 C 18 292, 12 314, 24 324 C 34 332, 52 326, 52 312 C 52 298, 44 288, 34 290 Z" fill="#6E4A38"/>
    </g>

    <!-- far legs -->
    <g class="part legs-far">
      <rect x="100" y="290" width="40" height="82" rx="17" fill="#EADFD3"/>
      <rect x="100" y="350" width="40" height="24" rx="11" fill="#5E3E2F"/>
      <rect x="242" y="290" width="40" height="82" rx="17" fill="#EADFD3"/>
      <rect x="242" y="350" width="40" height="24" rx="11" fill="#5E3E2F"/>
    </g>

    <!-- near back leg -->
    <g class="part leg-back">
      <rect x="70" y="296" width="42" height="84" rx="18" fill="#FFF8EF"/>
      <rect x="70" y="356" width="42" height="26" rx="12" fill="#6E4A38"/>
    </g>

    <!-- near front leg (hidden while the copy in front of the body waves) -->
    <g class="part wave-hide">
      <rect x="212" y="296" width="42" height="84" rx="18" fill="#FFF8EF"/>
      <rect x="212" y="356" width="42" height="26" rx="12" fill="#6E4A38"/>
    </g>

    <!-- body -->
    <g class="part body">
      <rect x="50" y="194" width="246" height="144" rx="72" fill="#FFF8EF"/>
      <g clip-path="url(#cow-body-clip)" stroke="none" fill="#6E4A38">
        <path d="M58 188 C 96 180, 150 188, 152 222 C 154 256, 112 266, 88 252 C 62 238, 36 200, 58 188 Z"/>
        <path d="M206 262 C 228 248, 262 256, 262 282 C 262 306, 230 316, 212 302 C 196 290, 190 272, 206 262 Z"/>
        <circle cx="146" cy="300" r="16"/>
      </g>
      <rect x="50" y="194" width="246" height="144" rx="72" fill="none"/>
    </g>

    <!-- the same front leg, drawn in front of the body, only shown while waving -->
    <g class="part wave" opacity="0" style="transform-origin:233px 306px">
      <rect x="212" y="296" width="42" height="84" rx="18" fill="#FFF8EF"/>
      <rect x="212" y="356" width="42" height="26" rx="12" fill="#6E4A38"/>
    </g>

    <!-- head -->
    <g class="part head" style="transform-origin:262px 222px">
      <g class="part ears">
        <g class="ear ear-l" style="transform-origin:216px 128px">
          <ellipse cx="190" cy="124" rx="36" ry="20" transform="rotate(-22 190 124)" fill="#FFF8EF"/>
          <ellipse cx="186" cy="126" rx="21" ry="10" transform="rotate(-22 186 126)" fill="#F7AFBA" stroke="none"/>
        </g>
        <g class="ear ear-r" style="transform-origin:328px 128px">
          <ellipse cx="354" cy="124" rx="36" ry="20" transform="rotate(22 354 124)" fill="#FFF8EF"/>
          <ellipse cx="358" cy="126" rx="21" ry="10" transform="rotate(22 358 126)" fill="#F7AFBA" stroke="none"/>
        </g>
      </g>
      <path d="M228 92 C 224 74, 230 60, 242 56 C 250 66, 254 80, 252 94 Z" fill="#F6E1AE"/>
      <path d="M316 92 C 320 74, 314 60, 302 56 C 294 66, 290 80, 292 94 Z" fill="#F6E1AE"/>
      <ellipse cx="272" cy="150" rx="82" ry="72" fill="#FFF8EF"/>
      <g clip-path="url(#cow-head-clip)" stroke="none" fill="#6E4A38">
        <path d="M184 96 C 206 76, 246 80, 250 108 C 254 132, 224 140, 206 132 C 188 124, 170 110, 184 96 Z"/>
      </g>
      <ellipse cx="272" cy="150" rx="82" ry="72" fill="none"/>

      <ellipse class="cheek" cx="208" cy="168" rx="14" ry="9" fill="#FF9EAA" opacity="0.6" stroke="none"/>
      <ellipse class="cheek" cx="336" cy="168" rx="14" ry="9" fill="#FF9EAA" opacity="0.6" stroke="none"/>

      <g class="part eyes" style="transform-origin:272px 140px">
        <ellipse cx="243" cy="140" rx="15" ry="19" fill="#3A2820" stroke="none"/>
        <circle cx="249" cy="133" r="6" fill="#fff" stroke="none"/>
        <circle cx="238" cy="148" r="2.8" fill="#fff" stroke="none"/>
        <ellipse cx="301" cy="140" rx="15" ry="19" fill="#3A2820" stroke="none"/>
        <circle cx="307" cy="133" r="6" fill="#fff" stroke="none"/>
        <circle cx="296" cy="148" r="2.8" fill="#fff" stroke="none"/>
      </g>
      <g class="part eyes-closed" opacity="0" fill="none">
        <path d="M229 140 Q 243 152 257 140"/>
        <path d="M287 140 Q 301 152 315 140"/>
      </g>

      <ellipse cx="272" cy="198" rx="66" ry="40" fill="#F7AFBA"/>
      <ellipse cx="250" cy="192" rx="8" ry="10" fill="#D9798B" stroke="none"/>
      <ellipse cx="294" cy="192" rx="8" ry="10" fill="#D9798B" stroke="none"/>
      <path class="part mouth" d="M256 214 Q 272 226 288 214" fill="none" stroke-width="6"/>
      <g class="part mouth-open" opacity="0">
        <ellipse cx="272" cy="220" rx="17" ry="16" fill="#7A3B3B" stroke-width="5"/>
        <ellipse cx="272" cy="229" rx="10" ry="5" fill="#F48B98" stroke="none"/>
      </g>
    </g>
  </g>
</svg>
