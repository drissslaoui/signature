<title>Welovebuzz Email Signature — Driss Slaoui</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  :root {
    --wlb-orange: #F18768;
    --wlb-dark: #0F181F;
    --wlb-grey: #D8D8D8;
    --wlb-white: #FFFFFF;
  }

  body {
    font-family: 'DM Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: var(--wlb-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .wrapper {
    max-width: 520px;
    width: 100%;
  }

  .brand-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .brand-header svg {
    width: 48px;
    height: auto;
    margin-bottom: 12px;
  }

  .brand-header h1 {
    font-size: 13px;
    font-weight: 400;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }

  .instructions {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 22px 26px;
    margin-bottom: 20px;
    font-size: 13.5px;
    color: rgba(255,255,255,0.6);
    line-height: 1.65;
  }

  .instructions h2 {
    font-size: 14px;
    font-weight: 500;
    color: var(--wlb-orange);
    margin-bottom: 10px;
  }

  .instructions ol {
    padding-left: 18px;
    margin-top: 6px;
  }

  .instructions li {
    margin-bottom: 4px;
  }

  .instructions strong {
    color: rgba(255,255,255,0.85);
    font-weight: 500;
  }

  .instructions code {
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--wlb-orange);
  }

  .signature-container {
    background: var(--wlb-white);
    border-radius: 12px;
    padding: 28px 32px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }

  .copy-btn {
    display: block;
    margin: 20px auto 0;
    padding: 13px 36px;
    background: var(--wlb-orange);
    color: var(--wlb-white);
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    letter-spacing: 0.3px;
  }

  .copy-btn:hover { 
    background: #e0725a;
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(241, 135, 104, 0.35);
  }

  .copy-btn.copied { 
    background: #2e7d32;
  }

  .footer-note {
    text-align: center;
    margin-top: 24px;
    font-size: 11.5px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 0.3px;
  }

  .footer-note a {
    color: var(--wlb-orange);
    text-decoration: none;
    opacity: 0.7;
  }
</style>
</head>

<script>
function copySignature() {
  const sig = document.getElementById('signature');
  const range = document.createRange();
  range.selectNodeContents(sig);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(range);
  try {
    document.execCommand('copy');
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = 'Copy Signature';
      btn.classList.remove('copied');
    }, 2000);
  } catch (err) {
    alert('Please manually select the signature and copy it (Ctrl+C / Cmd+C)');
  }
  sel.removeAllRanges();
}
</script>
